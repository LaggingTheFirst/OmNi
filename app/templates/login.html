{% extends "base.html" %}

{% block title %}Login - OmNi{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-card" style="width: 100%; max-width: 380px; padding: 40px; text-align: center;">

        <div style="margin-bottom: 30px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7L12 12L22 7L12 2Z"></path>
                <path d="M2 17L12 22L22 17"></path>
                <path d="M2 12L12 17L22 12"></path>
            </svg>
            <h2 style="margin-top: 15px; font-weight: 700;">Welcome Back</h2>
            <p class="text-muted text-sm">Sign in to access your OmNi Cloud</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" style="text-align: left;">
            <div style="margin-bottom: 20px;">
                <label for="username"
                    style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
            </div>

            <div style="margin-bottom: 30px;">
                <label for="password"
                    style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; justify-content: center;">
                Sign In
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </button>
        </form>
    </div>
</div>
{% endblock %}
