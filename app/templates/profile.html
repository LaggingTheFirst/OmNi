{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 40px; margin-bottom: 40px;">
    <div class="col-md-8 col-lg-5">
        <div class="glass-panel slide-up" style="padding: 40px; border-radius: 20px;">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 style="margin: 0; font-weight: 600;">Edit Profile</h2>
                <a href="{{ url_for('main.dashboard') }}" class="btn-close-custom"
                    style="text-decoration: none; font-size: 1.5rem; opacity: 0.5;">&times;</a>
            </div>

            <form method="POST" action="{{ url_for('main.profile') }}" enctype="multipart/form-data">

                <div class="text-center mb-5">
                    <div style="position: relative; display: inline-block;">
                        <img src="{{ url_for('main.avatar', filename=current_user.avatar_file) }}" alt="Avatar"
                            class="shadow-sm"
                            style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.1);">

                        <label for="avatar" class="btn btn-primary d-flex align-items-center justify-content-center"
                            style="position: absolute; bottom: 5px; right: 5px; border-radius: 50%; width: 40px; height: 40px; padding: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer;">
                            <span style="font-size: 1.2rem;">📷</span>
                        </label>
                        <input type="file" id="avatar" name="avatar" class="d-none" accept="image/*"
                            onchange="previewAvatar(this)">
                    </div>
                    <p style="margin-top: 15px; color: var(--text-secondary); font-size: 0.9rem;">Tap icon to change
                        photo</p>
                </div>

                <div class="form-group mb-4">
                    <label
                        style="font-weight: 500; margin-bottom: 8px; display: block; color: var(--text-secondary);">Username</label>
                    <input type="text" class="form-input" value="{{ current_user.username }}" disabled
                        style="opacity: 0.6; background: rgba(0,0,0,0.1); cursor: not-allowed;">
                </div>

                <div class="form-group mb-4">
                    <label for="display_name" style="font-weight: 500; margin-bottom: 8px; display: block;">Display
                        Name</label>
                    <input type="text" id="display_name" name="display_name" class="form-input"
                        placeholder="e.g. Alex Smith" value="{{ current_user.display_name or '' }}"
                        style="padding: 12px 15px;">
                </div>

                <div class="form-group mb-5">
                    <label for="bio" style="font-weight: 500; margin-bottom: 8px; display: block;">Bio</label>
                    <textarea id="bio" name="bio" class="form-input" rows="4"
                        placeholder="Tell us a little about yourself..."
                        style="padding: 12px 15px; resize: vertical; min-height: 100px;">{{ current_user.bio or '' }}</textarea>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-primary btn-lg"
                        style="width: 100%; padding: 12px; font-weight: 600;">Save Changes</button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-action"
                        style="width: 100%; padding: 12px; text-align: center; background: transparent; border: 1px solid rgba(255,255,255,0.1);">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function previewAvatar(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                document.querySelector('img[alt="Avatar"]').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
