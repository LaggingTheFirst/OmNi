{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 40px; margin-bottom: 40px;">

    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('main.dashboard') }}" class="text-muted hover:text-white"
            style="display: flex; align-items: center; gap: 5px; font-size: 0.9rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </a>
    </div>

    <div class="glass-panel" style="padding: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-weight: 700;">Edit Profile</h2>
        </div>

        <form method="POST" action="{{ url_for('main.profile') }}" enctype="multipart/form-data">

            <div style="text-align: center; margin-bottom: 40px;">
                <div style="position: relative; display: inline-block;">
                    <img src="{{ url_for('main.avatar', filename=current_user.avatar_file) }}" alt="Avatar"
                        style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);">

                    <label for="avatar"
                        style="position: absolute; bottom: 0; right: 0; background: var(--accent-primary); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </label>
                    <input type="file" id="avatar" name="avatar" style="display: none;" accept="image/*"
                        onchange="previewAvatar(this)">
                </div>
                <p class="text-xs text-muted" style="margin-top: 10px;">Click icon to upload new photo</p>
            </div>

            <div style="margin-bottom: 25px;">
                <label
                    style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">Username</label>
                <input type="text" value="{{ current_user.username }}" disabled
                    style="opacity: 0.5; cursor: not-allowed; background: rgba(255,255,255,0.05);">
            </div>

            <div style="margin-bottom: 25px;">
                <label for="display_name"
                    style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">Display
                    Name</label>
                <input type="text" id="display_name" name="display_name" placeholder="E.g. John Doe"
                    value="{{ current_user.display_name or '' }}">
            </div>

            <div style="margin-bottom: 30px;">
                <label for="bio"
                    style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">Bio</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Tell us a little about yourself..."
                    style="width: 100%; padding: 12px 18px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border-1); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit; resize: vertical;">{{ current_user.bio or '' }}</textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-ghost"
                    style="justify-content: center;">Cancel</a>
                <button type="submit" class="btn btn-primary" style="justify-content: center;">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    function previewAvatar(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                document.querySelector('img[alt="Avatar"]').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
